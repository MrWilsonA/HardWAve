version: '3.8'

services:
  # Next.js Fullstack Frontend & 3D Viewer
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hardwave_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_CHAIN_ID=31337
      - NEXT_PUBLIC_RPC_URL=http://blockchain-node:8545
    depends_on:
      - blockchain-node
    networks:
      - hardwave-net

  # Local EVM Hardhat Blockchain Node
  blockchain-node:
    build:
      context: ./contracts
      dockerfile: Dockerfile
    container_name: hardwave_blockchain
    restart: unless-stopped
    ports:
      - "8545:8545"
    networks:
      - hardwave-net

  # Relational Database for Fast Metadata Indexing
  postgres:
    image: postgres:16-alpine
    container_name: hardwave_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hardwave
      POSTGRES_PASSWORD: hardwave_password
      POSTGRES_DB: hardwave_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hardwave-net

networks:
  hardwave-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
